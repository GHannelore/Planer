<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2b5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Planer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Planer Uni & KBS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: Seitenleiste mit Ansichten links, Arbeitsfläche rechts; Uni = Blau, KBS = Ocker, überall gleich codiert */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --surface-2:#eceef3; --ink:#1b1f2a; --muted:#5d6477; --line:#d9dce5;
  --uni:#3446b8; --uni-soft:#e3e7fb; --kbs:#b8741a; --kbs-soft:#f8ecd9;
  --accent:#1f2b5c;
  --ok:#2c7a4b; --warn:#b26b00; --bad:#b3261e; --bad-soft:#fbe5e3; --warn-soft:#fdf0d9; --ok-soft:#e1f2e7;
  --font-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --r:10px; --ts:62%; --tl:40%; --tsl:91%;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13151c; --surface:#1c1f29; --surface-2:#252935; --ink:#e8eaf1; --muted:#9aa1b4; --line:#323747;
    --uni:#8f9cf2; --uni-soft:#262c52; --kbs:#e3a952; --kbs-soft:#3b2d17; --accent:#c9d0f5;
    --ok:#6fcf97; --warn:#f0b357; --bad:#f28b82; --bad-soft:#3d2120; --warn-soft:#3a2c14; --ok-soft:#1b3326; --ts:55%; --tl:72%; --tsl:24%;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13151c; --surface:#1c1f29; --surface-2:#252935; --ink:#e8eaf1; --muted:#9aa1b4; --line:#323747;
  --uni:#8f9cf2; --uni-soft:#262c52; --kbs:#e3a952; --kbs-soft:#3b2d17; --accent:#c9d0f5;
  --ok:#6fcf97; --warn:#f0b357; --bad:#f28b82; --bad-soft:#3d2120; --warn-soft:#3a2c14; --ok-soft:#1b3326; --ts:55%; --tl:72%; --tsl:24%;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:var(--bg);color:var(--ink);font:15px/1.45 var(--font-body);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.7rem} h2{font-size:1.15rem} h3{font-size:1rem}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--uni)}
:focus-visible{outline:2px solid var(--uni);outline-offset:2px}
.app{display:grid;grid-template-columns:224px 1fr;min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-family:var(--font-display);font-weight:700;font-size:1.15rem;padding:0 8px}
.brand small{display:block;font:500 .75rem var(--font-body);color:var(--muted)}
nav{display:flex;flex-direction:column;gap:2px}
nav a{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:500}
nav a:hover{background:var(--surface-2)}
nav a.on{background:var(--accent);color:var(--surface)}
.badge{font-size:.72rem;font-weight:600;background:var(--bad);color:#fff;border-radius:99px;padding:1px 7px}
.side .filter{display:flex;flex-direction:column;gap:6px;padding:0 8px}
.side .label{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.seg{display:flex;background:var(--surface-2);border-radius:8px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;padding:5px 6px;border-radius:6px;cursor:pointer;font-size:.85rem;font-weight:500}
.seg button.on{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.status{font-size:.78rem;color:var(--muted);padding:0 8px;margin-top:auto}
main{padding:24px clamp(16px,3vw,36px) 60px;min-width:0}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px}
.top .sub{color:var(--muted);margin-top:2px}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);font-size:.9rem}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.small{padding:3px 8px;font-size:.8rem}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:16px}
.g3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card h2{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.card h2 .count{font:500 .8rem var(--font-body);color:var(--muted)}
.empty{color:var(--muted);font-size:.9rem;padding:6px 0}
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:9px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .t{font-weight:500;overflow-wrap:anywhere}
.li .m{font-size:.8rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.li.done .t{text-decoration:line-through;color:var(--muted)}
.clickable{cursor:pointer}
.clickable:hover .t{text-decoration:underline}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;font-weight:600;padding:1px 8px;border-radius:99px;white-space:nowrap}
.tone{--fg:hsl(var(--h) var(--ts) var(--tl));--sf:hsl(var(--h) var(--ts) var(--tsl))}
.chip.uni{background:var(--sf,var(--uni-soft));color:var(--fg,var(--uni))}
.chip.kbs{background:var(--sf,var(--kbs-soft));color:var(--fg,var(--kbs))}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.neutral{background:var(--surface-2);color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.stripe{width:4px;border-radius:4px;align-self:stretch}
.stripe.uni{background:var(--fg,var(--uni))} .stripe.kbs{background:var(--fg,var(--kbs))}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);margin:2px 0 0;cursor:pointer}
.alerts{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.alert{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--ink);border:1px solid var(--line)}
.alert.bad{background:var(--bad-soft)}
.alert b{font-weight:600}
.alert .grow{flex:1;min-width:0}
.big{font-family:var(--font-display);font-size:1.9rem;font-weight:700;line-height:1}
.prog{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.prog.uni i{background:var(--uni)} .prog.kbs i{background:var(--kbs)}
/* Woche */
.week{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:8px;overflow-x:auto}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;min-height:150px;display:flex;flex-direction:column;gap:6px}
.day.today{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.day.free{background:repeating-linear-gradient(135deg,var(--surface),var(--surface) 8px,var(--surface-2) 8px,var(--surface-2) 16px)}
.day .dh{display:flex;justify-content:space-between;align-items:baseline;font-size:.82rem;color:var(--muted)}
.day .dh b{font-family:var(--font-display);font-size:1.2rem;color:var(--ink)}
.ev{border-radius:7px;padding:5px 7px;font-size:.8rem;cursor:pointer;border-left:3px solid;overflow-wrap:anywhere}
.ev.uni{background:var(--sf,var(--uni-soft));border-color:var(--fg,var(--uni))}
.ev.kbs{background:var(--sf,var(--kbs-soft));border-color:var(--fg,var(--kbs))}
.ev.exam{background:var(--bad-soft);border-color:var(--bad);font-weight:600}
.ev.task{background:var(--surface-2);border-color:var(--muted)}
.ev.cancel{opacity:.5;text-decoration:line-through}
.ev .tm{font-weight:600;margin-right:4px}
.ev .pl{display:block;color:var(--muted);font-size:.75rem;margin-top:2px}
/* Monat / Jahr */
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.month .wd{font-size:.72rem;color:var(--muted);text-align:center;font-weight:600}
.mc{background:var(--surface);border:1px solid var(--line);border-radius:7px;min-height:92px;padding:4px 5px;display:flex;flex-direction:column;gap:2px;cursor:pointer;min-width:0}
.mc.out{opacity:.4}
.mc.today{border-color:var(--accent);box-shadow:inset 0 2px 0 var(--accent)}
.mc.free{background:var(--surface-2)}
.mc .n{font-size:.78rem;font-weight:600}
.mc .e{font-size:.7rem;border-radius:4px;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc .e.uni{background:var(--sf,var(--uni-soft));color:var(--fg,var(--uni))} .mc .e.kbs{background:var(--sf,var(--kbs-soft));color:var(--fg,var(--kbs))} .mc .e.exam{background:var(--bad-soft);color:var(--bad);font-weight:600} .mc .e.task{background:var(--surface-2);color:var(--muted)}
.year{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.ym h3{margin-bottom:6px}
.ym .g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.ym .c{aspect-ratio:1;font-size:.68rem;display:flex;align-items:center;justify-content:center;border-radius:4px;position:relative;cursor:pointer}
.ym .c.wd{cursor:default;color:var(--muted);font-weight:600}
.ym .c.sem-uni{background:var(--uni-soft)} .ym .c.sem-kbs{background:var(--kbs-soft)} .ym .c.sem-both{background:linear-gradient(135deg,var(--uni-soft) 50%,var(--kbs-soft) 50%)}
.ym .c.free{background:var(--surface-2);color:var(--muted)}
.ym .c.today{outline:2px solid var(--accent)}
.ym .c.exam::after{content:"";position:absolute;bottom:2px;width:5px;height:5px;border-radius:50%;background:var(--bad)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin-bottom:14px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.sw{width:14px;height:14px;border-radius:4px;display:inline-block}
/* Tabellen */
.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th{text-align:left;font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tblwrap{overflow-x:auto}
.steps{display:flex;flex-wrap:wrap;gap:4px}
.step{font-size:.75rem;border:1px solid var(--line);border-radius:99px;padding:1px 8px;cursor:pointer;background:var(--surface)}
.step.done{background:var(--ok-soft);color:var(--ok);border-color:transparent}
/* Klassen */
.ctxcard{cursor:pointer;display:flex;flex-direction:column;gap:8px;border-top:4px solid var(--line)}
.ctxcard.uni{border-top-color:var(--fg,var(--uni))} .ctxcard.kbs{border-top-color:var(--fg,var(--kbs))}
.ctxcard:hover{border-color:var(--muted)}
.stats{display:flex;gap:16px;font-size:.82rem;color:var(--muted)}
.stats b{display:block;font-family:var(--font-display);font-size:1.25rem;color:var(--ink)}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:20px;text-align:center;color:var(--muted)}
.drop.over{border-color:var(--uni);background:var(--uni-soft)}

/* Klassen-Jahresplan */
.cyear{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.cyear .ym{padding:10px}
.cyear .g{grid-template-columns:repeat(7,minmax(0,1fr))}
.cyear .c{flex-direction:column;gap:1px;font-size:.7rem}
.cyear .c.les{background:var(--sf)}
.cyear .c.tpc{box-shadow:inset 0 -4px 0 hsl(var(--th) 60% 55%);}
.cyear .c.free{background:var(--surface-2);color:var(--muted)}
.cyear .c:hover{outline:1px solid var(--muted)}
.mks{display:flex;gap:2px;height:4px}
.mk{width:4px;height:4px;border-radius:50%;background:var(--ink)}
.mk.x{background:var(--bad)} .mk.d{background:var(--ok);border-radius:1px} .mk.n{background:var(--warn)}
.topicchip{display:inline-flex;gap:6px;align-items:center;font-size:.78rem;font-weight:600;padding:2px 9px;border-radius:99px;background:hsl(var(--th) 55% var(--tsl));color:hsl(var(--th) 55% var(--tl))}
.folder{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 10px;border-radius:8px;border:1px solid var(--line);cursor:pointer;border-left:5px solid hsl(var(--th) 60% 55%)}
.folder:hover{border-color:var(--muted)}
.section-h{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin:6px 0 4px}
.seats{display:grid;gap:6px}
.seat{border:1px dashed var(--line);border-radius:8px;min-height:46px;padding:4px;font-size:.78rem;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;background:var(--bg);overflow-wrap:anywhere}
.seat.on{border-style:solid;background:var(--sf);color:var(--fg);font-weight:600}
.board{text-align:center;font-size:.75rem;color:var(--muted);border-top:3px solid var(--muted);padding-top:4px;margin-bottom:8px}
.note{display:grid;grid-template-columns:1fr;gap:8px;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.note .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.note select,.note input,.inp{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 8px;font-size:.85rem;color:var(--ink)}
.inp{padding:7px 9px;font-size:.9rem}
textarea.inp{width:100%;min-height:90px;resize:vertical}
.cpage{display:grid;grid-template-columns:minmax(0,3fr) minmax(260px,1fr);gap:16px;align-items:start}
@media (max-width:1000px){.cpage{grid-template-columns:1fr}}
/* Modal */
.ov{position:fixed;inset:0;background:rgba(10,12,20,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:10;overflow:auto}
.modal{background:var(--surface);border-radius:14px;width:min(560px,100%);padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:14px}
.modal .head{display:flex;justify-content:space-between;align-items:center}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;font-weight:600;color:var(--muted)}
.form label.cb{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-weight:500;font-size:.9rem}
.form input:not([type=checkbox]),.form select,.form textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 9px;font-weight:400;color:var(--ink);width:100%}
.form textarea{min-height:80px;resize:vertical}
.foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:9px;font-size:.9rem;z-index:20}
.notice{background:var(--warn-soft);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;margin-bottom:16px;font-size:.9rem}
.colors{display:flex;gap:6px}
.colors button{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.colors button.on{border-color:var(--ink)}
.pill-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:0;z-index:5;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px 12px;gap:8px;border-right:0;border-bottom:1px solid var(--line)}
  .brand small,.side .filter .label{display:none}
  .side .filter{flex-direction:row;margin-left:auto;padding:0}
  .side .seg button{padding:4px 8px}
  nav{order:3;width:100%;flex-direction:row;overflow-x:auto;gap:4px}
  .status{order:4;width:100%;font-size:.72rem;padding:0 4px}
  nav a{white-space:nowrap;gap:6px}
  .status{margin-top:0}
  .form{grid-template-columns:1fr}
  .week{grid-template-columns:1fr}
  .day{min-height:0}
}
@media (prefers-reduced-motion:no-preference){ .modal{animation:pop .14s ease-out} @keyframes pop{from{transform:translateY(6px);opacity:.6}} }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">Planer<small>Uni Freiburg · KBS</small></div>
    <nav id="nav"></nav>
    <div class="filter">
      <span class="label">Anzeigen</span>
      <div class="seg" id="areaSeg">
        <button type="button" data-a="all">Alle</button>
        <button type="button" data-a="uni">Uni</button>
        <button type="button" data-a="kbs">KBS</button>
      </div>
    </div>
    <div class="status" id="status">Daten werden geladen …</div>
  </aside>
  <main id="main"></main>
</div>
<div id="modalRoot"></div>
<script src="config.js"></script>
<script>
"use strict";
/* ---------- Helfer ---------- */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const ds = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const TODAY = () => ds(new Date());
const diffDays = (a, b) => Math.round((pd(b) - pd(a)) / 86400000);
const WD = ["So","Mo","Di","Mi","Do","Fr","Sa"];
const WDL = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
const MON = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const fmtD = s => { if(!s) return ""; const d = pd(s); return `${WD[d.getDay()]} ${d.getDate()}.${d.getMonth()+1}.`; };
const fmtDL = s => { const d = pd(s); return `${WDL[d.getDay()]}, ${d.getDate()}. ${MON[d.getMonth()]} ${d.getFullYear()}`; };
const monday = d => { const x = new Date(d); const k = (x.getDay()+6)%7; x.setDate(x.getDate()-k); x.setHours(0,0,0,0); return x; };
const isoWeek = d => { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const n = t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-n); const y0 = new Date(Date.UTC(t.getUTCFullYear(),0,1)); return Math.ceil(((t-y0)/86400000+1)/7); };
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : "id-"+Date.now().toString(36)+Math.random().toString(36).slice(2,8));
const lsGet = (k, f) => { try { const v = localStorage.getItem(k); return v == null ? f : JSON.parse(v); } catch { return f; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
function toast(msg){ const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 2600); }
function relDays(n){ if(n===0) return "heute"; if(n===1) return "morgen"; if(n===-1) return "gestern"; if(n<0) return `vor ${-n} Tagen`; return `in ${n} Tagen`; }

/* ---------- Datenhaltung: Gerätespeicher (IndexedDB) + Abgleich über Supabase ---------- */

const areaOf = item => item?.kind === "ctx" ? item.area : (ctxOf(item)?.area || item?.area || "uni");
const inArea = item => S.area === "all" || areaOf(item) === S.area || (item.kind === "period" && item.area === "beide");
const visible = kind => all(kind).filter(inArea);

const idb = (() => {
  let dbp;
  const open = () => dbp ||= new Promise((res, rej) => {
    const r = indexedDB.open("planer", 1);
    r.onupgradeneeded = () => { const d = r.result; d.createObjectStore("items", { keyPath: "id" }); d.createObjectStore("blobs", { keyPath: "id" }); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  const tx = async (store, mode, fn) => { const d = await open(); return new Promise((res, rej) => { const t = d.transaction(store, mode); const s = t.objectStore(store); let out; const r = fn(s); if(r) r.onsuccess = () => { out = r.result; }; t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }); };
  return {
    all: st => tx(st, "readonly", s => s.getAll()),
    get: (st, k) => tx(st, "readonly", s => s.get(k)),
    put: (st, v) => tx(st, "readwrite", s => s.put(v)),
    del: (st, k) => tx(st, "readwrite", s => s.delete(k)),
    putMany: (st, vs) => tx(st, "readwrite", s => { vs.forEach(v => s.put(v)); }),
    clear: st => tx(st, "readwrite", s => s.clear())
  };
})();
const RAW = new Map(); // inkl. gelöschter Einträge (für den Abgleich)
function rebuild(){ S.items = new Map([...RAW.values()].filter(i => !i.deleted).map(i => [i.id, i])); }

async function initData(){
  try { if(navigator.storage?.persist) S.persisted = await navigator.storage.persist(); } catch {}
  try { for(const it of await idb.all("items")) RAW.set(it.id, it); S.mode = "ready"; }
  catch { S.mode = "error"; }
  rebuild(); renderAll(); sync();
}
async function save(item){
  const it = JSON.parse(JSON.stringify({ ...item, updated: Date.now(), dirty: true, deleted: false }));
  RAW.set(it.id, it); rebuild(); renderAll();
  try { await idb.put("items", it); } catch { toast("Speichern auf diesem Gerät nicht möglich."); }
  scheduleSync();
}
async function remove(id){
  const old = RAW.get(id);
  const t = { id, kind: old?.kind || "", deleted: true, updated: Date.now(), dirty: true };
  RAW.set(id, t); rebuild(); renderAll();
  try { await idb.put("items", t); } catch {}
  if(old?.assetId){ try { await idb.del("blobs", old.assetId); } catch {} lsSet("planer.blobDel", [...lsGet("planer.blobDel", []), old.assetId]); }
  scheduleSync();
}

/* ---- Supabase (nur REST, keine Bibliothek nötig) ---- */
const SYNC = { state: "off", last: lsGet("planer.lastSync", 0), busy: false, timer: null, err: "", again: false };
const conf = () => ({ url: String(lsGet("planer.url", "") || CFG.supabaseUrl || "").trim().replace(/\/+$/, ""), key: String(lsGet("planer.key", "") || CFG.supabaseAnonKey || "").trim() });
let session = lsGet("planer.session", null);
function setSession(j){ session = { access_token: j.access_token, refresh_token: j.refresh_token, expires_at: j.expires_at || Math.floor(Date.now()/1000) + (j.expires_in || 3600), user: { id: j.user?.id, email: j.user?.email } }; lsSet("planer.session", session); }
async function ensureToken(){
  if(!session) throw new Error("not_signed_in");
  if(session.expires_at > Date.now()/1000 + 60) return;
  const { url, key } = conf();
  const r = await fetch(`${url}/auth/v1/token?grant_type=refresh_token`, { method: "POST", headers: { apikey: key, "Content-Type": "application/json" }, body: JSON.stringify({ refresh_token: session.refresh_token }) });
  if(!r.ok){ if(r.status === 400 || r.status === 401){ session = null; lsSet("planer.session", null); throw new Error("not_signed_in"); } throw new Error("Anmeldung konnte nicht erneuert werden"); }
  setSession(await r.json());
}
async function authFetch(path, opts = {}){
  const { url, key } = conf();
  await ensureToken();
  const go = () => fetch(url + path, { ...opts, headers: { apikey: key, Authorization: `Bearer ${session.access_token}`, ...(opts.headers || {}) } });
  let r = await go();
  if(r.status === 401){ session.expires_at = 0; await ensureToken(); r = await go(); }
  return r;
}
async function authCall(kind, email, password){
  const { url, key } = conf();
  if(!url || !key) throw new Error("Zuerst Projekt-URL und Schlüssel eintragen.");
  const path = kind === "signup" ? "/auth/v1/signup" : "/auth/v1/token?grant_type=password";
  const r = await fetch(url + path, { method: "POST", headers: { apikey: key, "Content-Type": "application/json" }, body: JSON.stringify({ email, password }) });
  const j = await r.json().catch(() => ({}));
  if(!r.ok) throw new Error(j.error_description || j.msg || j.message || `Fehler ${r.status}`);
  if(j.access_token){ setSession(j); return "ok"; }
  return "confirm";
}
function scheduleSync(){ clearTimeout(SYNC.timer); SYNC.timer = setTimeout(sync, 1500); }
const dirtyCount = () => [...RAW.values()].filter(i => i.dirty).length;
async function sync(){
  if(SYNC.busy){ SYNC.again = true; return; }
  const { url, key } = conf();
  if(!url || !key || !session){ SYNC.state = "off"; renderStatus(); return; }
  if(!navigator.onLine){ SYNC.state = "offline"; renderStatus(); return; }
  SYNC.busy = true; SYNC.state = "busy"; renderStatus();
  try {
    // 1. Änderungen der anderen Geräte holen
    let cursor = lsGet("planer.cursor", "1970-01-01T00:00:00Z"), changed = false;
    for(;;){
      const r = await authFetch(`/rest/v1/items?select=id,data,updated,deleted,server_ts&server_ts=gt.${encodeURIComponent(cursor)}&order=server_ts.asc&limit=500`);
      if(!r.ok) throw new Error(`Abrufen fehlgeschlagen (${r.status}): ${(await r.text()).slice(0,160)}`);
      const rows = await r.json(); const puts = [];
      for(const row of rows){
        const l = RAW.get(row.id);
        if(l && l.dirty && l.updated > row.updated) continue;       // lokale Änderung ist neuer
        if(l && !l.dirty && l.updated === row.updated) continue;     // schon bekannt
        const it = row.deleted ? { id: row.id, kind: row.data?.kind || "", deleted: true, updated: row.updated, dirty: false } : { ...row.data, id: row.id, updated: row.updated, deleted: false, dirty: false };
        RAW.set(row.id, it); puts.push(it); changed = true;
      }
      if(puts.length) await idb.putMany("items", puts);
      if(rows.length){ cursor = rows[rows.length-1].server_ts; lsSet("planer.cursor", cursor); }
      if(rows.length < 500) break;
    }
    if(changed){ rebuild(); renderAll(); }
    // 2. Eigene Änderungen hochladen
    const dirty = [...RAW.values()].filter(i => i.dirty);
    for(let i = 0; i < dirty.length; i += 200){
      const batch = dirty.slice(i, i + 200);
      const body = batch.map(it => { const { id, updated, deleted, dirty: _d, ...data } = it; return { user_id: session.user.id, id, data, updated, deleted: !!deleted }; });
      const r = await authFetch(`/rest/v1/items?on_conflict=user_id,id`, { method: "POST", headers: { "Content-Type": "application/json", Prefer: "resolution=merge-duplicates,return=minimal" }, body: JSON.stringify(body) });
      if(!r.ok) throw new Error(`Hochladen fehlgeschlagen (${r.status}): ${(await r.text()).slice(0,160)}`);
      const done = [];
      for(const it of batch){ const cur = RAW.get(it.id); if(cur && cur.updated === it.updated){ cur.dirty = false; done.push(cur); } }
      if(done.length) await idb.putMany("items", done);
    }
    // 3. Dateien hochladen / löschen
    for(const b of (await idb.all("blobs")).filter(b => b.pending)){
      const r = await authFetch(`/storage/v1/object/files/${session.user.id}/${b.id}`, { method: "POST", headers: { "x-upsert": "true", "Content-Type": b.type || "application/octet-stream" }, body: b.blob });
      if(!r.ok) throw new Error(`Datei «${b.name}» nicht hochgeladen (${r.status})`);
      b.pending = false; await idb.put("blobs", b);
    }
    const dels = lsGet("planer.blobDel", []);
    for(const id of dels){ try { await authFetch(`/storage/v1/object/files/${session.user.id}/${id}`, { method: "DELETE" }); } catch {} }
    if(dels.length) lsSet("planer.blobDel", []);
    SYNC.state = "ok"; SYNC.err = ""; SYNC.last = Date.now(); lsSet("planer.lastSync", SYNC.last);
  } catch(e){
    SYNC.state = !session ? "off" : (navigator.onLine ? "error" : "offline");
    SYNC.err = e?.message === "not_signed_in" ? "Bitte neu anmelden." : String(e?.message || e);
  }
  SYNC.busy = false; renderStatus(); if(S.view === "sync") renderAll();
  if(SYNC.again){ SYNC.again = false; scheduleSync(); }
}
window.addEventListener("online", () => sync());
window.addEventListener("offline", () => { SYNC.state = "offline"; renderStatus(); });
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") sync(); });

/* ---- Dateien ---- */
async function getBlob(d){
  const b = await idb.get("blobs", d.assetId).catch(() => null);
  if(b) return b.blob;
  if(!session || !navigator.onLine) throw new Error("offline");
  const r = await authFetch(`/storage/v1/object/authenticated/files/${session.user.id}/${d.assetId}`);
  if(!r.ok) throw new Error("missing");
  const blob = await r.blob();
  await idb.put("blobs", { id: d.assetId, blob, name: d.fileName, type: d.contentType, pending: false });
  return blob;
}
async function openFile(d, download){
  try {
    const raw = await getBlob(d);
    const blob = d.contentType ? new Blob([raw], { type: d.contentType }) : raw;
    const u = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = u; a.rel = "noopener";
    if(download) a.download = d.fileName || d.title; else a.target = "_blank";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 120000);
  } catch(e){ toast(e.message === "offline" ? "Diese Datei liegt noch nicht auf diesem Gerät. Öffne sie einmal mit Internet." : "Datei nicht gefunden. Wurde sie auf dem anderen Gerät schon abgeglichen?"); }
}
async function uploadFiles(files, meta = {}){
  for(const f of files){
    if(f.size > 50 * 1024 * 1024){ toast(`${f.name} ist grösser als 50 MB.`); continue; }
    const assetId = uid();
    try {
      await idb.put("blobs", { id: assetId, blob: f, name: f.name, type: f.type || "", pending: true });
      await save({ id: uid(), kind: "doc", created: Date.now(), title: meta.title || f.name.replace(/\.[^.]+$/, ""), ctx: meta.ctx ?? (S.docFilter !== "all" ? S.docFilter : (S.view === "klasse" ? S.ctxId : "")), tag: meta.tag || "Material", notes: meta.notes || "", url: meta.url || "", day: meta.day || "", topic: meta.topic || "", assetId, fileName: f.name, size: f.size, contentType: f.type || "" });
      toast(`${f.name} gespeichert`);
    } catch { toast(`${f.name} konnte nicht gespeichert werden.`); }
  }
}

async function importData(file){
  try {
    const j = JSON.parse(await file.text());
    const items = Array.isArray(j) ? j : j.items;
    if(!Array.isArray(items)) throw 0;
    const now = Date.now(), puts = [];
    for(const x of items){ if(!x || !x.id || !x.kind) continue; const it = { ...x, updated: now, dirty: true, deleted: false }; RAW.set(it.id, it); puts.push(it); }

  } catch { toast("Diese Datei ist kein Planer-Export."); }

/* ---------- Kalenderlogik ---------- */
function periodsOn(day){ return all("period").filter(p => p.start && p.end && p.start <= day && day <= p.end); }
function isFreeFor(day, area){ return periodsOn(day).some(p => p.type === "frei" && (p.area === "beide" || p.area === area)); }
function occurrences(from, to, ignoreArea = false){
  const out = [];
  for(const ev of all("event")){
    if(!ev.date || (!ignoreArea && !inArea(ev))) continue;
    const step = ev.repeat === "weekly" ? 7 : ev.repeat === "biweekly" ? 14 : 0;
    const area = areaOf(ev);
    const push = day => {
      const plan = (ev.plans || {})[day] || {};
      const free = ev.skipHolidays !== false && step && isFreeFor(day, area);
      if(free) return;
      out.push({ ev, day, plan, cancelled: !!plan.cancelled });
    };
    if(!step){ if(ev.date >= from && ev.date <= to) push(ev.date); continue; }
    let d = pd(ev.date);
    const fromD = pd(from), toD = pd(to);
    if(d < fromD){ const k = Math.floor((fromD - d) / 86400000 / step); d = addDays(d, k*step); }
    while(d <= toD){
      const s = ds(d);
      if(ev.until && s > ev.until) break;
      if(s >= from && s >= ev.date) push(s);
      d = addDays(d, step);
    }
  }
  return out.sort((a,b) => (a.day+(a.ev.start||"99")).localeCompare(b.day+(b.ev.start||"99")));
}
function agenda(from, to){
  const map = {};
  const add = (day, x) => (map[day] ||= []).push(x);
  for(const o of occurrences(from, to)) add(o.day, { type: "occ", ...o });
  for(const t of visible("task")){ const d = t.day || t.due; if(d && d >= from && d <= to && !t.done) add(d, { type: "task", t }); }
  for(const e of visible("exam")) if(e.date && e.date >= from && e.date <= to) add(e.date, { type: "exam", e });
  return map;
}
function reminders(){
  const today = TODAY(), out = [];
  for(const t of visible("task")){
    if(t.done || !t.due) continue;
    const n = diffDays(today, t.due);
    if(n < 0) out.push({ sev: "bad", text: `Überfällig: ${t.title}`, sub: `${fmtD(t.due)} · ${ctxOf(t)?.name || ""}`, id: t.id });
    else if(t.remind !== "" && t.remind != null && n <= Number(t.remind)) out.push({ sev: "warn", text: `${t.title}`, sub: `fällig ${relDays(n)} (${fmtD(t.due)}) · ${ctxOf(t)?.name || ""}`, id: t.id });
  }
  for(const e of visible("exam")){
    if(!e.date) continue;
    const n = diffDays(today, e.date);
    const r = e.remind === "" || e.remind == null ? 7 : Number(e.remind);
    const open = (e.steps || []).filter(s => !s.done).length;
    if(n >= 0 && n <= r) out.push({ sev: n <= 2 ? "bad" : "warn", text: `Prüfung ${relDays(n)}: ${e.title}`, sub: `${fmtD(e.date)}${open ? ` · noch ${open} Schritt${open>1?"e":""} offen` : ""}`, id: e.id });
  }
  return out.sort((a,b) => (a.sev === "bad" ? 0 : 1) - (b.sev === "bad" ? 0 : 1));
}

    <div class="head"><h2>${isNew ? "Neu: " : ""}${esc(sch.label)}</h2><button type="button" class="btn ghost" id="mclose" aria-label="Schliessen">✕</button></div>

    <div class="foot"><div class="row">${isNew ? "" : `<button type="button" class="btn danger" id="mdel">Löschen</button>`}${opts.extraBtns || ""}</div>
    <div class="row"><button type="button" class="btn" id="mcancel">Abbrechen</button><button class="btn primary" type="submit">Speichern</button></div></div>
  </form></div>`;
  const close = () => { root.innerHTML = ""; S.modal = null; const r = S.returnTo; S.returnTo = null; if(r) r(); };
  $("#mclose").onclick = close; $("#mcancel").onclick = close;
  $(".ov").addEventListener("mousedown", e => { if(e.target.classList.contains("ov")) close(); });
  document.addEventListener("keydown", function k(e){ if(e.key === "Escape"){ close(); document.removeEventListener("keydown", k); } });
  const del = $("#mdel");
  if(del) del.onclick = async () => {
    if(del.dataset.sure){ close(); await remove(item.id); toast("Gelöscht"); }
    else { del.dataset.sure = 1; del.textContent = "Wirklich löschen?"; }
  };
  opts.onOpen?.(root, it);
  $("#mform").onsubmit = async e => {
    e.preventDefault();
    const f = e.target;
    for(const [k,,t] of sch.fields){ const el = f.elements[k]; it[k] = t === "checkbox" ? el.checked : el.value.trim(); }
    opts.beforeSave?.(it, f);
    if(kind === "exam" && !it.steps){ const a = it.ctx ? areaOf({ctx: it.ctx}) : "uni"; it.steps = EXAM_STEPS[a].map(t => ({ t, done: false })); }
    if(isNew){ it.id = uid(); it.kind = kind; it.created = Date.now(); }
    close();
    await save(it);
  };
  setTimeout(() => $("#mform input:not([type=checkbox]), #mform select")?.focus(), 30);
}

function defaultsFor(kind){

/* ---------- Bausteine ---------- */
const ctxChip = item => { const c = item.kind === "ctx" ? item : ctxOf(item); if(!c) return ""; return `<span class="chip ${c.area} tone"${tAttr(c)}>${esc(c.short || c.name)}</span>`; };
const dueChip = (due, done) => {
  if(!due) return `<span class="chip neutral">ohne Datum</span>`;
  if(done) return `<span class="chip neutral">${fmtD(due)}</span>`;
  const n = diffDays(TODAY(), due);
  const cls = n < 0 ? "bad" : n <= 2 ? "warn" : "neutral";
  return `<span class="chip ${cls}">${fmtD(due)} · ${relDays(n)}</span>`;
};
function taskRow(t){
  return `<div class="li ${t.done ? "done" : ""}">
    <input type="checkbox" data-done="${t.id}" ${t.done ? "checked" : ""} aria-label="Erledigt: ${esc(t.title)}">
    <div class="clickable" data-edit="${t.id}"><div class="t">${t.prio === "hoch" ? "❗ " : ""}${esc(t.title)}</div>
      <div class="m">${ctxChip(t)}${t.day && !t.done ? `<span class="chip neutral">geplant ${fmtD(t.day)}</span>` : ""}${t.due || !t.day ? dueChip(t.due, t.done) : ""}${t.forClass ? `<span class="chip neutral">Auftrag Klasse</span>` : ""}</div></div>
    <div class="row" style="justify-content:flex-end">${t.url ? `<a class="btn small" href="${esc(t.url)}" target="_blank" rel="noopener">Öffnen</a>` : ""}${t.forClass ? `<button type="button" class="btn small" data-copy="${t.id}" title="Auftrag kopieren und Teams öffnen">→ Teams</button>` : ""}</div>
  </div>`;
}
function examRow(e){
  const n = e.date ? diffDays(TODAY(), e.date) : null;
  const steps = e.steps || [];
  const done = steps.filter(s => s.done).length;
  const past = n != null && n < 0;
  return `<div class="li"><span class="stripe ${areaOf(e)} tone"${tAttr(e)}></span>
    <div class="clickable" data-edit="${e.id}"><div class="t">${esc(e.title)}</div>
    <div class="m">${ctxChip(e)}${e.date ? `<span>${fmtD(e.date)}${e.time ? " "+e.time : ""}</span>` : `<span class="chip warn">Datum offen</span>`}${steps.length ? `<span>${done}/${steps.length} vorbereitet</span>` : ""}</div></div>
    <div>${n == null ? "" : past ? `<span class="chip neutral">vorbei</span>` : `<div style="text-align:right"><div class="big">${n}</div><div style="font-size:.72rem;color:var(--muted)">Tage</div></div>`}</div></div>`;
}
function occBlock(o){
  const c = ctxOf(o.ev);
  return `<div class="ev ${areaOf(o.ev)} tone ${o.cancelled ? "cancel" : ""}"${tAttr(o.ev)} data-occ="${o.ev.id}|${o.day}" tabindex="0">
    ${o.ev.start ? `<span class="tm">${o.ev.start}</span>` : ""}${esc(o.ev.title)}${o.ev.location ? ` · ${esc(o.ev.location)}` : ""}
    ${o.plan.topic ? `<span class="pl">${esc(o.plan.topic)}</span>` : c && c.area === "kbs" && !o.cancelled ? `<span class="pl">+ Stunde planen</span>` : ""}
  </div>`;
}
function agendaBlock(x){
  if(x.type === "occ") return occBlock(x);
  if(x.type === "task") return `<div class="ev task" data-edit="${x.t.id}" tabindex="0">☐ ${esc(x.t.title)}</div>`;
  return `<div class="ev exam" data-edit="${x.e.id}" tabindex="0">Prüfung: ${esc(x.e.title)}</div>`;
}

function vKalender(){

  const nav = `<div class="seg" style="width:auto"><button type="button" data-cal="week" class="${S.calMode==="week"?"on":""}">Woche</button><button type="button" data-cal="month" class="${S.calMode==="month"?"on":""}">Monat</button></div>

}

/* ---------- Kurs- / Klassenseite ---------- */
function schoolYear(){ const now = new Date(); const y = now.getMonth() >= 7 ? now.getFullYear() : now.getFullYear() - 1; return { y, from: `${y}-08-01`, to: `${y+1}-07-31` }; }
function ctxData(cid, from, to){
  const by = () => ({});
  const occ = occurrences(from, to, true).filter(o => o.ev.ctx === cid);
  const les = new Set(occ.filter(o => !o.cancelled).map(o => o.day));
  const tk = by(), ex = by(), dc = by(), nt = by();
  for(const t of all("task")) if(t.ctx === cid && !t.done){ const d = t.day || t.due; if(d) (tk[d] ||= []).push(t); }
  for(const e of all("exam")) if(e.ctx === cid && e.date) (ex[e.date] ||= []).push(e);
  for(const d of all("doc")) if(d.ctx === cid && d.day) (dc[d.day] ||= []).push(d);
  for(const n of all("note")) if(n.ctx === cid && n.day) (nt[n.day] ||= []).push(n);
  const topics = all("topic").filter(t => t.ctx === cid && t.start && t.end).sort((a,b) => a.start.localeCompare(b.start));
  return { occ, les, tk, ex, dc, nt, topics };
}
function topicDocs(t){ return all("doc").filter(d => d.ctx === t.ctx && (d.topic === t.id || (d.day && d.day >= t.start && d.day <= t.end))); }
function vKlasse(){
  const c = get(S.ctxId);
  if(!c) return pageHead("Nicht gefunden", "") + `<a href="#klassen">Zurück zu den Klassen</a>`;
  const today = TODAY();
  const { y, from, to } = schoolYear();
  const D = ctxData(c.id, from, to);
  const months = [...Array(12)].map((_, i) => new Date(y, 7 + i, 1));
  const cell = s => {
    const tp = D.topics.find(t => t.start <= s && s <= t.end);
    const free = isFreeFor(s, c.area);
    const cls = ["c", free ? "free" : D.les.has(s) ? "les" : "", tp ? "tpc" : "", s === today ? "today" : ""].join(" ");
    const mk = (D.tk[s] ? `<i class="mk"></i>` : "") + (D.ex[s] ? `<i class="mk x"></i>` : "") + (D.dc[s] ? `<i class="mk d"></i>` : "") + (D.nt[s] ? `<i class="mk n"></i>` : "");
    const tip = [fmtD(s), tp ? tp.title : "", D.les.has(s) ? "Lektion" : "", D.tk[s] ? `${D.tk[s].length} Aufgabe(n)` : "", D.ex[s] ? "Prüfung" : "", D.dc[s] ? `${D.dc[s].length} Dokument(e)` : ""].filter(Boolean).join(" · ");
    return `<div class="${cls}" style="--th:${tp ? topicHue(tp) : 0}" data-day="${c.id}|${s}" title="${esc(tip)}" tabindex="0"><span>${pd(s).getDate()}</span><span class="mks">${mk}</span></div>`;
  };
  const year = `<div class="cyear">${months.map(m => { const st = monday(m); const cells = []; for(let i = 0; i < 42; i++){ const d = addDays(st, i); if(i >= 35 && d.getMonth() !== m.getMonth()) break; cells.push(d.getMonth() === m.getMonth() ? cell(ds(d)) : `<div></div>`); }
    return `<div class="card ym"><h3>${MON[m.getMonth()]} ${m.getFullYear()}</h3><div class="g">${["M","D","M","D","F","S","S"].map(w => `<div class="c wd">${w}</div>`).join("")}${cells.join("")}</div></div>`; }).join("")}</div>`;
  const open = all("task").filter(t => t.ctx === c.id && !t.done).sort((a,b) => (a.due || a.day || "9999").localeCompare(b.due || b.day || "9999"));
  const exams = all("exam").filter(e => e.ctx === c.id && (!e.date || e.date >= today)).sort((a,b) => (a.date||"9999").localeCompare(b.date||"9999"));
  const studs = all("student").filter(s => s.ctx === c.id).sort((a,b) => a.name.localeCompare(b.name));
  const links = `${c.teamsUrl ? `<a class="btn" href="${esc(c.teamsUrl)}" target="_blank" rel="noopener">Teams öffnen</a>` : ""}${c.onenoteUrl ? `<a class="btn" href="${esc(c.onenoteUrl)}" target="_blank" rel="noopener">OneNote / Moodle</a>` : ""}<button type="button" class="btn" data-edit="${c.id}">Bearbeiten</button>`;
  const seat = c.seating || { rows: 4, cols: 6, seats: {} };
  const seatGrid = `<div class="board">Wandtafel / Pult</div><div class="seats" style="grid-template-columns:repeat(${seat.cols},minmax(0,1fr))">${[...Array(seat.rows * seat.cols)].map((_, i) => { const k = `${Math.floor(i/seat.cols)}-${i%seat.cols}`; const st = get(seat.seats?.[k]); return `<button type="button" class="seat ${st ? "on tone" : ""}"${st ? tAttr(c) : ""} data-seat="${k}">${st ? esc(st.name) : "+"}</button>`; }).join("")}</div>
    <div class="row" style="margin-top:10px;font-size:.82rem;color:var(--muted)"><label>Reihen <input class="inp" id="seatRows" type="number" min="1" max="10" value="${seat.rows}" style="width:64px"></label><label>Plätze pro Reihe <input class="inp" id="seatCols" type="number" min="1" max="12" value="${seat.cols}" style="width:64px"></label>${studs.filter(s => !Object.values(seat.seats || {}).includes(s.id)).length ? `<span>Ohne Platz: ${studs.filter(s => !Object.values(seat.seats || {}).includes(s.id)).map(s => esc(s.name)).join(", ")}</span>` : ""}</div>`;
  return `<div style="margin-bottom:8px"><a href="#klassen" style="font-size:.88rem">‹ Klassen & Kurse</a></div>` +
    pageHead(`<span class="dot" style="width:14px;height:14px;background:hsl(${hueOf(c)} 60% 50%);vertical-align:middle;margin-right:8px"></span>${esc(c.name)}`, `${c.area === "kbs" ? "KBS-Klasse" : "Uni-Kurs"} · Jahresplan ${y}/${String(y+1).slice(2)} · Klick auf einen Tag: Aufgaben, Dokumente und Notizen ablegen`, links) +
    `<div class="cpage">
      <div>
        <div class="legend"><span><i class="sw tone" style="--h:${hueOf(c)};background:var(--sf)"></i>${c.area === "kbs" ? "Lektion" : "Kurstermin"}</span><span><i class="sw" style="box-shadow:inset 0 -4px 0 var(--muted);background:var(--surface-2)"></i>Themenblock</span><span><i class="mk"></i>Aufgabe</span><span><i class="mk x"></i>Prüfung</span><span><i class="mk d"></i>Dokument</span><span><i class="mk n"></i>Notiz</span></div>
        <div class="tone"${tAttr(c)}>${year}</div>
      </div>
      <div class="grid" style="gap:16px">
        <div class="card"><h2>Offene Aufgaben <span class="count">${open.length}</span></h2>${open.length ? `<div class="list">${open.map(taskRow).join("")}</div>` : `<div class="empty">Alles erledigt.</div>`}<button type="button" class="btn small" data-newk="task" style="margin-top:8px">+ Aufgabe</button></div>
        <div class="card"><h2>Themenblöcke <button type="button" class="btn small" data-newk="topic">+ Block</button></h2>${D.topics.length ? `<div class="grid" style="gap:8px">${D.topics.map(t => `<div class="folder" style="--th:${topicHue(t)}" data-topic="${t.id}" tabindex="0"><span aria-hidden="true">▤</span><div><div style="font-weight:600">${esc(t.title)}</div><div style="font-size:.78rem;color:var(--muted)">${fmtD(t.start)} – ${fmtD(t.end)}</div></div><span class="chip neutral">${topicDocs(t).length} Dok.</span></div>`).join("")}</div>` : `<div class="empty">Markiere Themen über einen Zeitraum. Dokumente aus diesen Tagen landen automatisch im Ordner des Themas.</div>`}</div>
        <div class="card"><h2>Prüfungen <button type="button" class="btn small" data-newk="exam">+ Prüfung</button></h2>${exams.length ? `<div class="list">${exams.map(examRow).join("")}</div>` : `<div class="empty">Keine anstehenden Prüfungen.</div>`}</div>
      </div>
    </div>
    <div class="grid g2" style="margin-top:16px">
      <div class="card"><h2>${c.area === "kbs" ? "Infos zur Klasse" : "Infos zum Kurs"} <span class="count" id="infoState"></span></h2><textarea class="inp" id="ctxInfo" style="min-height:220px" placeholder="${c.area === "kbs" ? "z. B. Klassenlehrperson, Absprachen, Lehrmittel, Nachteilsausgleiche, Elternkontakte …" : "z. B. Dozent:in, Raum, Leistungsnachweis, Abgabefristen …"}">${esc(c.info)}</textarea><div style="font-size:.78rem;color:var(--muted);margin-top:4px">Wird gespeichert, sobald du ausserhalb des Feldes klickst.</div></div>
      ${c.area === "kbs" ? `<div class="card"><h2>Klassenspiegel</h2>${studs.length ? seatGrid : `<div class="empty">Füge unten zuerst die Schüler:innen hinzu, dann kannst du sie den Plätzen zuordnen.</div>`}</div>
      <div class="card" style="grid-column:1/-1"><h2>Schüler:innen <span class="count">${studs.length}</span></h2>
        ${studs.length ? `<div class="tblwrap"><table class="tbl"><thead><tr><th>Name</th><th>Notizen</th><th></th></tr></thead><tbody>${studs.map(s => `<tr><td style="font-weight:500">${esc(s.name)}</td><td style="color:var(--muted)">${esc(s.notes) || "–"}</td><td><button type="button" class="btn small" data-edit="${s.id}">Bearbeiten</button></td></tr>`).join("")}</tbody></table></div>` : ""}
        <form id="bulkStud" style="margin-top:12px" class="form"><label class="full">Mehrere hinzufügen: ein Name pro Zeile (z. B. aus einer Klassenliste kopiert)<textarea id="bs-names" name="names" placeholder="Muster Anna&#10;Beispiel Luca"></textarea></label><div class="full"><button class="btn primary" type="submit">Schüler:innen hinzufügen</button></div></form></div>` : ""}
    </div>`;
}

  const root = $("#modalRoot");
  root.innerHTML = `<div class="ov"><div class="modal" style="width:min(660px,100%)">
    <div class="head"><div><h2>${fmtDL(day)}</h2><div class="row" style="margin-top:6px">${ctxChip(c)}<span id="dayTopic" class="row"></span></div></div><button type="button" class="btn ghost" id="dclose" aria-label="Schliessen">✕</button></div>

    <form id="dayLink" class="row"><input class="inp" id="dl-title" name="title" placeholder="Dokument (Titel)" style="flex:1;min-width:140px"><input class="inp" id="dl-url" name="url" type="url" placeholder="Link aus Teams/OneDrive" style="flex:1;min-width:160px"><button class="btn" type="submit">Link ablegen</button>${assets ? `<label class="btn" style="cursor:pointer">Datei ablegen<input type="file" id="dayFile" multiple hidden></label>` : ""}</form>
    <form id="dayNote" class="row"><input class="inp" id="dn-t" name="t" placeholder="Notiz zu diesem Tag" style="flex:1"><button class="btn" type="submit">Notiz</button></form>
    <div class="foot"><div class="row"><button type="button" class="btn" id="dayTopicBtn">Themenblock ab hier</button><button type="button" class="btn" id="dayEvent">+ Termin</button></div><button type="button" class="btn" id="dclose2">Schliessen</button></div>
  </div></div>`;
  const close = () => { root.innerHTML = ""; S.modal = null; };
  $("#dclose").onclick = close; $("#dclose2").onclick = close;

  const back = () => openDay(cid, day);
  $("#dayTask").onsubmit = async e => { e.preventDefault(); const f = e.target; const t = f.elements.t.value.trim(); if(!t) return; f.elements.t.value = ""; await save({ id: uid(), kind: "task", created: Date.now(), title: t, ctx: cid, day, due: f.elements.due.value, prio: "normal", remind: "1", done: false }); };
  $("#dayLink").onsubmit = async e => { e.preventDefault(); const f = e.target; const url = f.elements.url.value.trim(), title = f.elements.title.value.trim(); if(!url && !title) return; f.reset(); await save({ id: uid(), kind: "doc", created: Date.now(), title: title || url, url, ctx: cid, day, tag: "Material", notes: "" }); };
  $("#dayNote").onsubmit = async e => { e.preventDefault(); const f = e.target; const t = f.elements.t.value.trim(); if(!t) return; f.reset(); await save({ id: uid(), kind: "note", created: Date.now(), text: t, ctx: cid, day }); };
  const df = $("#dayFile"); if(df) df.onchange = () => uploadFiles([...df.files], { ctx: cid, day });
  $("#dayTopicBtn").onclick = () => { S.returnTo = back; openForm("topic", { ctx: cid, start: day, end: ds(addDays(pd(day), 27)) }); };
  $("#dayEvent").onclick = () => { S.returnTo = back; openForm("event", { ctx: cid, date: day, repeat: "none", title: c.short || c.name }); };

function fillDay(){
  const { ctx: cid, day } = S.modal; const c = get(cid); const box = $("#dayLists"); if(!c || !box) return;
  const occ = occurrences(day, day, true).filter(o => o.ev.ctx === cid);
  const tps = all("topic").filter(t => t.ctx === cid && t.start <= day && day <= t.end);
  const tasks = all("task").filter(t => t.ctx === cid && (t.day === day || t.due === day)).sort((a,b) => a.done - b.done);
  const docs = all("doc").filter(d => d.ctx === cid && d.day === day);
  const notes = all("note").filter(n => n.ctx === cid && n.day === day);
  const exams = all("exam").filter(e => e.ctx === cid && e.date === day);
  $("#dayTopic").innerHTML = tps.map(t => `<button type="button" class="topicchip" style="--th:${topicHue(t)};border:0;cursor:pointer" data-topic="${t.id}">▤ ${esc(t.title)}</button>`).join("");
  const sec = (h, body) => `<div><div class="section-h">${h}</div>${body}</div>`;
  box.innerHTML =
    (occ.length ? sec(c.area === "kbs" ? "Lektion" : "Termin", `<div class="grid" style="gap:6px">${occ.map(occBlock).join("")}</div>`) : isFreeFor(day, c.area) ? sec("Ferien / frei", `<div class="empty">An diesem Tag ist unterrichtsfrei.</div>`) : "") +
    (exams.length ? sec("Prüfung", `<div class="list">${exams.map(examRow).join("")}</div>`) : "") +
    sec("Aufgaben", tasks.length ? `<div class="list">${tasks.map(taskRow).join("")}</div>` : `<div class="empty">Noch keine Aufgaben für diesen Tag.</div>`) +
    (docs.length ? sec("Dokumente", `<div class="list">${docs.map(docRow).join("")}</div>`) : "") +
    (notes.length ? sec("Notizen", `<div class="list">${notes.map(n => `<div class="li" style="grid-template-columns:1fr auto"><div class="txt" style="white-space:pre-wrap">${esc(n.text)}</div><button type="button" class="btn small" data-ndel="${n.id}">Löschen</button></div>`).join("")}</div>`) : "");
  bindCommon($("#modalRoot"), () => openDay(cid, day));
}

/* ---------- Themenblock-Ordner ---------- */
function openTopic(id){
  const t = get(id); if(!t) return;
  S.modal = { type: "topic", id };
  const root = $("#modalRoot");
  root.innerHTML = `<div class="ov"><div class="modal" style="width:min(660px,100%)">

    <div id="topicLists" class="grid" style="gap:12px"></div>
    <form id="topicLink" class="row"><input class="inp" id="tl-title" name="title" placeholder="Dokument (Titel)" style="flex:1;min-width:140px"><input class="inp" id="tl-url" name="url" type="url" placeholder="Link aus Teams/OneDrive" style="flex:1;min-width:160px"><button class="btn" type="submit">In Ordner ablegen</button>${assets ? `<label class="btn" style="cursor:pointer">Datei<input type="file" id="topicFile" multiple hidden></label>` : ""}</form>
    <div class="foot"><button type="button" class="btn" id="tedit">Themenblock bearbeiten</button><button type="button" class="btn" id="tclose2">Schliessen</button></div>
  </div></div>`;

  $("#tclose").onclick = close; $("#tclose2").onclick = close;
  $(".ov").addEventListener("mousedown", e => { if(e.target.classList.contains("ov")) close(); });
  $("#tedit").onclick = () => { S.returnTo = () => get(id) && openTopic(id); openForm("topic", t); };
  const today = TODAY(), day = today >= t.start && today <= t.end ? today : t.start;
  $("#topicLink").onsubmit = async e => { e.preventDefault(); const f = e.target; const url = f.elements.url.value.trim(), title = f.elements.title.value.trim(); if(!url && !title) return; f.reset(); await save({ id: uid(), kind: "doc", created: Date.now(), title: title || url, url, ctx: t.ctx, day, topic: id, tag: "Material", notes: "" }); };
  const tf = $("#topicFile"); if(tf) tf.onchange = () => uploadFiles([...tf.files], { ctx: t.ctx, day, topic: id });
  fillTopic();
}
function fillTopic(){
  const t = get(S.modal.id); const box = $("#topicLists"); if(!t || !box) return;
  const docs = topicDocs(t).sort((a,b) => (a.day||"").localeCompare(b.day||""));

  const occ = occurrences(t.start, t.end, true).filter(o => o.ev.ctx === t.ctx);
  const sec = (h, body) => `<div><div class="section-h">${h}</div>${body}</div>`;
  box.innerHTML = sec(`Dokumente (${docs.length})`, docs.length ? `<div class="list">${docs.map(d => docRow(d).replace('<div class="m">', `<div class="m"><span>${d.day ? fmtD(d.day) : ""}</span>`)).join("")}</div>` : `<div class="empty">Noch leer. Lege Dokumente an einem Tag dieses Blocks ab oder direkt hier.</div>`) +
    sec(`Aufgaben (${tasks.filter(x => !x.done).length} offen)`, tasks.length ? `<div class="list">${tasks.map(taskRow).join("")}</div>` : `<div class="empty">Keine Aufgaben in diesem Zeitraum.</div>`) +
    sec(`Stunden (${occ.length})`, occ.length ? `<div class="grid" style="gap:6px">${occ.map(o => `<div class="row" style="gap:10px;align-items:flex-start"><span style="width:62px;font-size:.82rem;color:var(--muted);padding-top:5px">${fmtD(o.day)}</span><div style="flex:1">${occBlock(o)}</div></div>`).join("")}</div>` : `<div class="empty">Keine Lektionen in diesem Zeitraum.</div>`);
  bindCommon($("#modalRoot"), () => get(t.id) && openTopic(t.id));
}

/* ---------- Klassenspiegel ---------- */
function openSeat(cid, key){
  const c = get(cid); const seat = c.seating || { rows: 4, cols: 6, seats: {} };
  const studs = all("student").filter(s => s.ctx === cid).sort((a,b) => a.name.localeCompare(b.name));
  const cur = seat.seats?.[key];
  const root = $("#modalRoot");
  root.innerHTML = `<div class="ov"><div class="modal" style="width:min(420px,100%)"><div class="head"><h2>Platz ${key.split("-").map(n => Number(n)+1).join(" / ")}</h2><button type="button" class="btn ghost" id="sclose" aria-label="Schliessen">✕</button></div>
    <div class="list">${studs.map(s => { const where = Object.entries(seat.seats || {}).find(([k,v]) => v === s.id)?.[0]; return `<div class="li clickable" data-pick="${s.id}" tabindex="0" style="grid-template-columns:1fr auto"><div class="t">${esc(s.name)}</div><span style="font-size:.78rem;color:var(--muted)">${s.id === cur ? "hier" : where ? "sitzt woanders" : ""}</span></div>`; }).join("")}</div>
    <div class="foot"><button type="button" class="btn" id="sclear">Platz leeren</button><button type="button" class="btn" id="sclose2">Abbrechen</button></div></div></div>`;
  const close = () => root.innerHTML = "";
  $("#sclose").onclick = close; $("#sclose2").onclick = close;
  const put = async sid => { const seats = { ...(seat.seats || {}) }; for(const k of Object.keys(seats)) if(seats[k] === sid) delete seats[k]; if(sid) seats[key] = sid; else delete seats[key]; close(); await save({ ...c, seating: { ...seat, seats } }); };
  $("#sclear").onclick = () => put(null);
  root.querySelectorAll("[data-pick]").forEach(el => { el.onclick = () => put(el.dataset.pick); el.onkeydown = e => { if(e.key === "Enter") put(el.dataset.pick); }; });

  m.querySelectorAll("[data-ntask]").forEach(b => b.onclick = async () => { const n = get(b.dataset.ntask); if(!n) return; const [first, ...rest] = n.text.split(/\r?\n/); await save({ id: uid(), kind: "task", created: Date.now(), title: first.slice(0, 140), notes: rest.join("\n").trim(), ctx: n.ctx || "", day: n.day || "", due: "", prio: "normal", remind: "1", done: false }); await remove(n.id); toast("Als Aufgabe übernommen"); });
  const qt = $("#quickTask");
  if(qt) qt.onsubmit = async e => { e.preventDefault(); const t = qt.elements.title.value.trim(); if(!t) return; await save({ id: uid(), kind: "task", created: Date.now(), title: t, ctx: qt.elements.ctx.value, due: qt.elements.due.value, prio: "normal", remind: "1", done: false }); toast("Aufgabe erfasst"); };
  const bs = $("#bulkStud");
  if(bs) bs.onsubmit = async e => { e.preventDefault(); const names = bs.names.value.split(/\r?\n/).map(s => s.trim()).filter(Boolean); for(const n of names) await save({ id: uid(), kind: "student", created: Date.now(), name: n, ctx: S.ctxId, notes: "" }); toast(`${names.length} hinzugefügt`); };
  const drop = $("#drop"), fi = $("#fileIn");
  if(fi) fi.onchange = () => uploadFiles([...fi.files]);
  if(drop){
    drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
    drop.ondragleave = () => drop.classList.remove("over");
    drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); uploadFiles([...e.dataTransfer.files]); };
  }
}
document.querySelectorAll("#areaSeg button").forEach(b => b.onclick = () => { S.area = b.dataset.a; lsSet("planer.area", S.area); renderAll(); });
window.addEventListener("hashchange", route);

route();
initData();
if("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("./sw.js").catch(() => {});
</script>
</body>
</html>
